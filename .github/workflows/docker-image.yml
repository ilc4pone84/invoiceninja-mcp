name: Publish Docker image

on:
  # Erst nach grüner CI auf main bauen, olav rollt :main automatisch aus.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  # Keyless-Signatur mit cosign (OIDC-Token von GitHub, kein gespeicherter Schlüssel).
  id-token: write

jobs:
  docker:
    if: github.repository == 'ilc4pone84/invoiceninja-mcp' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/ilc4pone84/invoiceninja-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}

      # olav rollt nur Images aus, die dieser Workflow auf main signiert hat.
      # Prüfen: cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   --certificate-identity https://github.com/ilc4pone84/invoiceninja-mcp/.github/workflows/docker-image.yml@refs/heads/main IMAGE@DIGEST
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
